# coturn for OpenDesk 0.4. OpenDesk.Service hands out short-lived credentials made from the
# shared secret below (TURN REST API); no static TURN users exist. setup-turn.sh fills the values.
listening-port=3478
external-ip=__PUBLIC_IP__
min-port=49160
max-port=49200
fingerprint
use-auth-secret
static-auth-secret=__SECRET__
realm=opendesk
no-tls
no-dtls
no-cli
no-multicast-peers
# WebRTC relays UDP only; TCP relay (RFC 6062) would just make an open proxy.
no-tcp-relay
# Relay only to the public internet, never into the server's own or private networks.
denied-peer-ip=__PUBLIC_IP__
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
user-quota=12
total-quota=200
stale-nonce=600
simple-log
syslog
