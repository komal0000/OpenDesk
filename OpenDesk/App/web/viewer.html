<!doctype html>
<meta charset="utf-8"><title>OpenDesk viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f2023; overflow: hidden; font: 13px "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; outline: none; cursor: default; }
  #message { position: fixed; inset: 0; display: grid; place-items: center; color: #d6d6da; font-size: 16px; pointer-events: none; }
  #overlay { position: fixed; top: 8px; right: 8px; padding: 6px 10px; background: rgba(0,0,0,.65); color: #fff; border-radius: 4px; white-space: pre; display: none; pointer-events: none; }
</style>
<canvas id="screen" tabindex="0" width="16" height="9"></canvas>
<div id="message">Connecting…</div>
<div id="overlay"></div>
<script src="common.js"></script>
<script>
const canvas = document.getElementById('screen'), context = canvas.getContext('2d', { alpha: false, desynchronized: true });
const message = document.getElementById('message'), overlay = document.getElementById('overlay');
const channels = {}, decoding = new Map(); // timestamp -> { display, started }
const KEY_CODE = /^[A-Za-z0-9]{2,24}$/, encoder = new TextEncoder();
// status comes from the app: control, epoch (sent with input), display (the monitor generation), input enabled.
let pc, status = { control: false, epoch: -1, display: -1, input: false }, shownDisplay = -1, waitingKey = true, keyAsked = -1000;
let pending = null, filled = 0, recorder = null, writing = Promise.resolve();
const stats = { frames: 0, decodeMs: 0, bytes: 0 };
let decoder = createDecoder();

chrome.webview.addEventListener('message', e => {
  const m = e.data;
  if (m.t === 'start') start(m.ice).catch(err => post({ t: 'failed', message: String(err?.message ?? err) }));
  else if (m.t === 'answer') pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).catch(err => post({ t: 'failed', message: String(err?.message ?? err) }));
  else if (m.t === 'send') sendWithAck(channels[m.ch], fromBase64(m.data), m.ack);
  else if (m.t === 'status') { const had = active(); status = m; if (had && !active()) sendReset(); }
  else if (m.t === 'message') { message.textContent = m.text; message.style.display = m.text ? 'grid' : 'none'; }
  else if (m.t === 'overlay') overlay.style.display = m.on ? 'block' : 'none';
  else if (m.t === 'screenshot') canvas.toBlob(async blob => post({ t: 'screenshot', data: toBase64(new Uint8Array(await blob.arrayBuffer())) }), 'image/png');
  else if (m.t === 'record') record(m.on);
  else if (m.t === 'close') pc?.close();
});

// The viewer offers; the host answers only after its owner approves.
async function start(iceServers) {
  pc = new RTCPeerConnection({ iceServers });
  for (const label of ['control', 'input', 'files', 'video']) {
    const channel = pc.createDataChannel(label);
    channel.binaryType = 'arraybuffer';
    channel.onclose = () => failAcks(channel);
    channel.onmessage = label === 'video' ? m => receivePiece(new Uint8Array(m.data))
      : label === 'input' ? null : m => post({ t: 'recv', ch: label, data: toBase64(new Uint8Array(m.data)) });
    channels[label] = channel;
  }
  pc.onconnectionstatechange = () => post({ t: 'state', state: pc.connectionState });
  await pc.setLocalDescription();
  await gathered(pc);
  post({ t: 'offer', sdp: pc.localDescription.sdp });
}

// ---- Video ----
function createDecoder() {
  const d = new VideoDecoder({ output: show, error: e => { post({ t: 'error', message: 'Video decoder: ' + e.message }); setTimeout(resetDecoder); } });
  d.configure({ codec: 'avc1.640033', optimizeForLatency: true });
  return d;
}
function resetDecoder() { try { decoder.close(); } catch { } decoding.clear(); decoder = createDecoder(); waitingKey = true; askKeyframe(); }
function askKeyframe() {
  const now = performance.now();
  if (now - keyAsked < 250 || channels.control?.readyState !== 'open') return;
  keyAsked = now;
  channels.control.send(pack(MessageKinds.Keyframe));
}
// Reassembles one frame from its pieces; the channel is reliable and ordered.
function receivePiece(piece) {
  stats.bytes += piece.length;
  let packet;
  if (!pending) {
    const length = VIDEO_HEADER + new DataView(piece.buffer, piece.byteOffset).getUint32(17);
    if (piece.length === length) packet = piece; // most frames fit in one piece
    else { pending = new Uint8Array(length); filled = 0; }
  }
  if (!packet) {
    pending.set(piece, filled); filled += piece.length;
    if (filled < pending.length) return;
    packet = pending; pending = null;
  }
  const view = new DataView(packet.buffer, packet.byteOffset);
  const key = (view.getUint8(0) & 1) === 1, display = view.getFloat64(1), timestamp = Math.round(view.getFloat64(9) * 1000);
  // A decoder that falls behind would add lag: skip to the next keyframe instead.
  if (!key && (waitingKey || decoder.decodeQueueSize > 2)) { waitingKey = true; askKeyframe(); return; }
  waitingKey = false;
  decoding.set(timestamp, { display, started: performance.now() });
  decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp, data: packet.subarray(VIDEO_HEADER) }));
}
function show(frame) {
  const info = decoding.get(frame.timestamp);
  decoding.delete(frame.timestamp);
  if (info) stats.decodeMs += performance.now() - info.started;
  const display = info?.display ?? shownDisplay;
  const resized = canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight;
  if (resized) { canvas.width = frame.displayWidth; canvas.height = frame.displayHeight; }
  context.drawImage(frame, 0, 0);
  frame.close();
  stats.frames++;
  if (resized || display !== shownDisplay) { shownDisplay = display; message.style.display = 'none'; post({ t: 'frame' }); }
}

// ---- Input (sent straight to the host; it checks control and epoch again) ----
// Input waits until the image shown is of the current monitor, so coordinates match the host's display.
const active = () => status.control && status.input && shownDisplay === status.display && channels.input?.readyState === 'open';
function sendInput(event) { channels.input.send(pack(MessageKinds.Input, encoder.encode(JSON.stringify(event)))); }
function send(kind, fields) { if (active()) sendInput({ Kind: kind, Epoch: status.epoch, ...fields }); }
function sendReset() { if (status.control && channels.input?.readyState === 'open') sendInput({ Kind: 'reset', Epoch: status.epoch }); }
// Pointer position inside the letterboxed image, 0..1, or null outside it.
function point(e) {
  const box = canvas.getBoundingClientRect(), scale = Math.min(box.width / canvas.width, box.height / canvas.height);
  const w = canvas.width * scale, h = canvas.height * scale, x = (e.clientX - box.left - (box.width - w) / 2) / w, y = (e.clientY - box.top - (box.height - h) / 2) / h;
  return x >= 0 && y >= 0 && x <= 1 && y <= 1 ? { X: x, Y: y } : null;
}
const buttonCode = b => b === 0 ? 1 : b === 2 ? 2 : b === 1 ? 3 : 0;
let move = null;
canvas.addEventListener('pointerdown', e => {
  canvas.focus(); canvas.setPointerCapture(e.pointerId);
  if (!active()) { post({ t: 'hint' }); return; }
  const p = point(e), code = buttonCode(e.button);
  if (p && code) send('button', { ...p, Code: code, Down: true });
});
canvas.addEventListener('pointerup', e => {
  const p = point(e), code = buttonCode(e.button);
  if (!p) sendReset(); else if (code) send('button', { ...p, Code: code, Down: false });
});
canvas.addEventListener('pointercancel', sendReset);
// Moves are coalesced to one per display frame.
canvas.addEventListener('pointermove', e => {
  const p = point(e);
  if (!p) return;
  if (!move) requestAnimationFrame(() => { send('move', move); move = null; });
  move = p;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const p = point(e), delta = Math.max(-1200, Math.min(1200, Math.round(-e.deltaY * (e.deltaMode === 1 ? 40 : 1.2))));
  if (p && delta) send('wheel', { ...p, Delta: delta });
}, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && e.code === 'F12') { e.preventDefault(); sendReset(); post({ t: 'release' }); return; }
  if (!active()) { if (e.code === 'Escape') post({ t: 'escape' }); return; }
  e.preventDefault();
  if (KEY_CODE.test(e.code)) send('key', { Key: e.code, Down: true });
});
addEventListener('keyup', e => {
  if (!active()) return;
  e.preventDefault();
  if (KEY_CODE.test(e.code)) send('key', { Key: e.code, Down: false });
});
addEventListener('blur', sendReset);
document.addEventListener('visibilitychange', () => { if (document.hidden) sendReset(); });

// ---- Recording: the canvas as WebM, written by the app in chunks ----
function record(on) {
  if (on && !recorder) {
    // H.264 may use the GPU encoder; VP8 is the fallback every Chromium has.
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=h264') ? 'video/webm;codecs=h264' : 'video/webm;codecs=vp8';
    recorder = new MediaRecorder(canvas.captureStream(30), { mimeType, videoBitsPerSecond: 6000000 });
    recorder.ondataavailable = e => { if (e.data.size) writing = writing.then(async () => post({ t: 'recording', data: toBase64(new Uint8Array(await e.data.arrayBuffer())) })); };
    recorder.onstop = () => { writing = writing.then(() => post({ t: 'recorded' })); };
    recorder.start(1000);
  }
  else if (!on && recorder) { recorder.stop(); recorder = null; }
}

// ---- Stats overlay, and the route for the app's status line ----
setInterval(async () => {
  if (!pc || pc.connectionState !== 'connected') return;
  const r = await route(pc), frames = stats.frames;
  overlay.textContent = `${frames} fps · decode ${frames ? (stats.decodeMs / frames).toFixed(1) : '–'} ms\n${Math.round(stats.bytes * 8 / 1000)} kbit/s · ` +
    (r ? `${r.relay ? 'relayed (TURN)' : 'direct'} ${r.protocol} · rtt ${r.rtt} ms` : 'route unknown') + `\n${canvas.width}×${canvas.height}`;
  if (r) post({ t: 'route', relay: r.relay });
  stats.frames = 0; stats.decodeMs = 0; stats.bytes = 0;
}, 1000);

// Test hook for the app smoke check: a click at (x, y), then the time until the pixel at (px, py)
// becomes light (or dark) in the decoded video.
window.probeClick = (x, y, px, py, light) => new Promise(resolve => {
  const started = performance.now(), sample = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  send('button', { X: x, Y: y, Code: 1, Down: true }); send('button', { X: x, Y: y, Code: 1, Down: false });
  const check = () => {
    sample.drawImage(canvas, px * canvas.width, py * canvas.height, 1, 1, 0, 0, 1, 1);
    const [r, g, b] = sample.getImageData(0, 0, 1, 1).data, luma = 0.299 * r + 0.587 * g + 0.114 * b;
    if (light ? luma > 180 : luma < 70) return resolve(performance.now() - started);
    if (performance.now() - started > 3000) return resolve(-1);
    requestAnimationFrame(check);
  };
  check();
});
post({ t: 'ready' });
</script>
